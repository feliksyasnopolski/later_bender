servers:
- url: https://{host}
  variables:
    host:
      default: laterbender.example
tags:
- name: Authentication
- name: Projects
- name: Tasks
- name: Notes
- name: Files
- name: Search
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          oneOf:
          - type: string
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
              details:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    Credential:
      type: object
      required:
      - ref
      - name
      - kind
      - created_at
      - updated_at
      properties:
        ref:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - env
          - file
        env_name:
          type: string
        file_path:
          type: string
        file_mode:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CredentialList:
      type: object
      required:
      - credentials
      - next_cursor
      properties:
        credentials:
          type: array
          items:
            "$ref": "#/components/schemas/Credential"
        next_cursor:
          type: string
          nullable: true
    CredentialInput:
      type: object
      required:
      - name
      - kind
      - secret
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - env
          - file
        secret:
          type: string
          writeOnly: true
        env_name:
          type: string
        file_path:
          type: string
        file_mode:
          type: integer
    CredentialDelete:
      type: object
      required:
      - ref
      - destroyed
      properties:
        ref:
          type: string
        destroyed:
          type: boolean
    User:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: integer
        username:
          type: string
    Session:
      type: object
      required:
      - user
      - token
      properties:
        user:
          "$ref": "#/components/schemas/User"
        token:
          type: string
    Project:
      type: object
      required:
      - id
      - name
      - slug
      - shorthand
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        shorthand:
          type: string
        description:
          type: string
          nullable: true
        archived_at:
          type: string
          nullable: true
          format: date-time
        task_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Task:
      type: object
      required:
      - id
      - ref
      - number
      - title
      - status
      - position
      - priority
      - tags
      - project
      properties:
        id:
          type: integer
        ref:
          type: string
        number:
          type: integer
        title:
          type: string
        status:
          type: string
          enum:
          - backlog
          - ready
          - doing
          - done
          - dropped
        position:
          type: integer
        priority:
          type: string
          enum:
          - low
          - normal
          - high
        context:
          type: string
          nullable: true
        intended_direction:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        related_note_ids:
          type: array
          items:
            type: integer
        related_file_refs:
          type: array
          items:
            type: string
        project:
          "$ref": "#/components/schemas/Project"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Note:
      type: object
      required:
      - id
      - title
      - body
      - tags
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        project:
          "$ref": "#/components/schemas/Project"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SessionInput:
      type: object
      required:
      - username
      - code
      - password
      - password_confirmation
      properties:
        username:
          type: string
        code:
          type: string
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    TokenCreateInput:
      type: object
      properties:
        name:
          type: string
    ApiToken:
      type: object
      required:
      - id
      - name
      - created_at
      properties:
        id:
          type: integer
        name:
          type: string
        last_used_at:
          type: string
          nullable: true
          format: date-time
        revoked_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
    ApiTokenWithSecret:
      allOf:
      - "$ref": "#/components/schemas/ApiToken"
      - type: object
        required:
        - token
        properties:
          token:
            type: string
    TotpCreateInput:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          format: password
        label:
          type: string
    TotpConfirmInput:
      type: object
      required:
      - password
      - code
      properties:
        password:
          type: string
          format: password
        code:
          type: string
    TotpCredential:
      type: object
      required:
      - id
      - label
      - created_at
      properties:
        id:
          type: integer
        label:
          type: string
        created_at:
          type: string
          format: date-time
    TotpList:
      type: object
      required:
      - credentials
      properties:
        credentials:
          type: array
          items:
            "$ref": "#/components/schemas/TotpCredential"
    TotpCreate:
      type: object
      required:
      - credential
      - secret
      - provisioning_uri
      - qr_svg_base64
      properties:
        credential:
          type: object
          properties:
            id:
              type: integer
            label:
              type: string
        secret:
          type: string
        provisioning_uri:
          type: string
        qr_svg_base64:
          type: string
    TotpConfirmation:
      type: object
      required:
      - credential
      properties:
        credential:
          "$ref": "#/components/schemas/TotpCredential"
    TokenInfo:
      type: object
      required:
      - active
      - user_id
      - client_id
      - scope
      - exp
      properties:
        active:
          type: boolean
        user_id:
          type: integer
        client_id:
          type: string
        scope:
          type: string
        exp:
          type: integer
    ProjectInput:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        shorthand:
          type: string
        description:
          type: string
        archived_at:
          type: string
          nullable: true
          format: date-time
    TaskInput:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
        position:
          type: integer
        priority:
          type: string
        context:
          type: string
        intended_direction:
          type: string
        tags:
          type: array
          items:
            type: string
        related_note_ids:
          type: array
          items:
            type: integer
        related_file_refs:
          type: array
          items:
            type: string
        citations:
          type: array
          items:
            type: object
            additionalProperties: true
    NoteInput:
      type: object
