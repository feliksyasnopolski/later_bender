name: Publish MCP image

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable MCP image
        uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/feliksyasnopolski/later-bender-mcp:sha-${{ github.sha }}
          labels: |
            service=later-bender-mcp
